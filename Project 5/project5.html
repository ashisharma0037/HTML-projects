<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data collection form</title>
</head>
<body>
<h1><center><mark> Student Data Collection Form.</mark></center></h1>
<p><b><center>Please fill all the details carefully.</b><i> All fields are mandatory.</i><u> Make sure information is correct.</center></u></p>  
<hr>
<form>
    <fieldset>
        <legend><b>Personal Information</b></legend>

        <label>Full Name :</label>
        <input type="text" placeholder="Enter Your Full Name">
        <br><br>

        <label>Email :</label>
        <input type="email" placeholder="Enter Your Email">
        <br><br>

        <label>Password :</label>
        <input type="password" placeholder="Enter Your password">
        <br><br>

        <lable>Age : </lable>
        <input type="number" value="18" min="18" max="60">
        <br><br>

        <label>Date Of Birth : </label>
        <input type="date">
        <br><br>

        
        <label>Upload Photo : </label>
        <input type="file">
        <br><br>
    
 </fieldset>

 <fieldset>
  <legend><b>Academic Information</b></legend> 
    <label>Branch :</label>
            <input type="radio" name="Branch">
            <label>BCA</label>
            <input type="radio" name="Branch">
            <label>B.Tech</label>
            <br>
            <br>
    <label>Skills :</label>
            <input type="checkbox" name="Skills" >
            <label>HTML</label>
            <input type="checkbox" name="Skills" >
            <label>CSS</label>
            <input type="checkbox" name="Skills" >
            <lable>JavaScript</lable>
             <input type="checkbox" name="Skills" >
            <lable>Python</lable>
            <br>
            <br>
    <label>Select Year:</label>
<select>
    <option selected>--Select Year--</option>
    <option>1st Year</option>
    <option>2nd Year</option>
    <option>3rd Year</option>
    <option>4th Year</option>
</select>
<br>
<br>

 <label>Portfolio URL :</label>
        <input type="url" placeholder="https://example.com">
        <br>
        <br>

        <label>Study Time:</label>
        <input type="time">
        <br>
        <br>

 <label>Preferred Week:</label>
        <input type="week">
        <br>
        <br>

        
 <label>Preferred Month:</label>
        <input type="month">
        <br>
        <br>
        
 <label>Date & Time of Admission:</label>
        <input type="datetime-local">
        <br>
        <br>

 </fieldset>


 <fieldset> 
<legend><b>Feedback Section</b></legend>
<label>Rate Your HTML Knowledge (0-10): </label>
<input type="range">
<br>
<br>
 <label>Write Your Feedback :</label>
            <br>
            <textarea placeholder="Write Your Feedback Here ..." rows="5" cols="50"></textarea>
            <br>
            <br>

   <label><mark>Note:</mark> Range is between 0 to 10.</label>         

 </fieldset>

        <center>
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">
</center>
<hr>
<br>
<center><p><b>Thank you for registering!</b><i>We will contact you soon.</i></p></center>


</body>
</html>
